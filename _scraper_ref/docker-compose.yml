services:
  mongodb:
    image: mongo:7
    container_name: scrapper-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - scrapper-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapper-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/scrapper
    depends_on:
      - mongodb
    networks:
      - scrapper-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapper-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scrapper-net

volumes:
  mongo_data:

networks:
  scrapper-net:
    driver: bridge
